services:
  # ── Backend A: Ollama (profile: ollama) ───────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-tinyllama}
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ${OLLAMA_DATA:-.ollama-data}:/root/.ollama
      - ./ollama-entrypoint.sh:/entrypoint.sh:ro
    networks:
      default:
        aliases: ["backend"]   # stable origin name the tunnel targets
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # ── Backend B: llama.cpp (profile: llama) ─────────────────────────────────
  # llama-server reads every setting from LLAMA_ARG_* variables in .env (see
  # tools/server/README.md in llama.cpp). With LLAMA_ARG_HF_REPO it downloads the
  # model, and its mmproj when the repo has one, into the shared Hugging Face cache
  # (HF_HOME=/hf), so files dedup with ComfyUI and other HF tools.
  llama:
    # CUDA 12 image on purpose: low-bit Qwen3.6 quants emit gibberish on CUDA
    # 13.2, and the model needs a recent build (>= b8954). Pin a digest in
    # production for reproducibility.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: ["llama"]
    env_file: .env
    environment:
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=11434          # match ollama's port so the tunnel origin is identical
      - LLAMA_API_KEY=${API_KEY}      # llama-server's name for .env's API_KEY (defense-in-depth on the LAN)
      - HF_HOME=/hf                   # the cache's path inside the container (mounted below)
      - HF_TOKEN                      # from the host's environment when .env doesn't set it
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ${HF_HOME}:/hf                # host HF_HOME (shell first, then .env)
    networks:
      default:
        aliases: ["backend"]   # same alias as ollama → http://backend:11434 works for either
    ports:
      - "${LLAMA_HOST_PORT}:11434"     # host port from .env (another value when something else holds 11434)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11434/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s       # first start downloads the model; loading into VRAM can take minutes
    restart: unless-stopped

  # ── Tunnel: always runs, follows whichever backend profile is active ──────
  cloudflared:
    image: ghcr.io/procyon-creative/cloudflare-tunnel-init:latest
    env_file: .env
    volumes:
      - ./tunnel-config.json:/config/tunnel-config.json:ro
      - tunnel-data:/shared
    depends_on:
      # required:false → not an error when a backend's profile is inactive
      # (needs Compose v2.20.2+). The active backend is waited on as healthy.
      ollama:
        condition: service_healthy
        required: false
      llama:
        condition: service_healthy
        required: false
    restart: unless-stopped

networks:
  default:

volumes:
  tunnel-data:
